name: Release

# Push a tag like `v1.0.0` on `main` and this workflow publishes the same
# build artifact to both npm and ClawHub. The tag is the source of truth —
# the package.json version must match (the workflow refuses to publish if
# they drift). See RELEASING.md for the operator recipe.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Must already exist on main."
        required: true

permissions:
  contents: read
  id-token: write   # required for npm Trusted Publishing + ClawHub OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: publish to npm (Trusted Publishing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node 24 (ships with npm >= 11.5.1 — Trusted Publishing requirement)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Print resolved node + npm versions (sanity)
        run: |
          node --version
          npm --version

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          # GITHUB_REF_NAME is always set by the runner (it's the branch, e.g.
          # "main", on a workflow_dispatch run) — a bash `:-` fallback never
          # sees it as empty, so `inputs.tag` was never actually used on a
          # manual retry. Branch on the event name instead.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_RAW="${{ inputs.tag }}"
          else
            TAG_RAW="$GITHUB_REF_NAME"
          fi
          TAG="${TAG_RAW#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version v$PKG"
            exit 1
          fi
          echo "OK: tag v$TAG matches package.json v$PKG"

      # Lets a workflow_dispatch re-run retry a downstream job alone (e.g.
      # ClawHub failed last time, npm didn't): npm registries reject
      # re-publishing an existing version, so detect that case up front
      # instead of letting `npm publish` fail the whole run on a retry.
      - name: Check whether this version is already on npm
        id: npm-check
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          if npm view "openclaw-hawkins@$PKG" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "openclaw-hawkins@$PKG is already on npm — skipping npm publish (rebuilding the tarball below so ClawHub still gets the same artifact)."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Typecheck + build + test (regression gate)
        run: |
          npx tsc --noEmit
          npm run build
          npm run coverage

      - name: Preview the tarball
        run: |
          npm pack --dry-run
          npm pack
          ls -lh openclaw-hawkins-*.tgz

      - name: Publish to npm (Trusted Publishing + provenance)
        if: steps.npm-check.outputs.already_published != 'true'
        run: npm publish --provenance --access public

      - name: Upload tarball as workflow artifact (audit)
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball-${{ github.ref_name }}
          path: openclaw-hawkins-*.tgz
          if-no-files-found: error

  publish-clawhub:
    name: publish to ClawHub
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Write ClawHub auth config (the CLI doesn't read CLAWHUB_TOKEN directly)
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          install -m 700 -d "$RUNNER_TEMP"
          jq -n --arg token "$CLAWHUB_TOKEN" \
                --arg registry "https://clawhub.ai" \
                '{registry: $registry, token: $token}' \
            > "$RUNNER_TEMP/clawhub-config.json"
          chmod 600 "$RUNNER_TEMP/clawhub-config.json"
          echo "CLAWHUB_CONFIG_PATH=$RUNNER_TEMP/clawhub-config.json" >> "$GITHUB_ENV"

      # Mirrors the npm idempotency check: lets a retry (e.g. after the
      # Publish step below succeeded but a later job in the same run failed)
      # skip re-publishing instead of erroring on an already-published version.
      - name: Check whether this version is already on ClawHub
        id: clawhub-check
        run: |
          set -euo pipefail
          # GITHUB_REF_NAME is always set by the runner (it's the branch, e.g.
          # "main", on a workflow_dispatch run) — a bash `:-` fallback never
          # sees it as empty, so `inputs.tag` was never actually used on a
          # manual retry. Branch on the event name instead.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_RAW="${{ inputs.tag }}"
          else
            TAG_RAW="$GITHUB_REF_NAME"
          fi
          VERSION="${TAG_RAW#v}"
          STATE=$(clawhub package publication openclaw-hawkins --version "$VERSION" --json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).state")
          if [ "$STATE" = "published" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "openclaw-hawkins@$VERSION is already published on ClawHub — skipping."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "ClawHub state for openclaw-hawkins@$VERSION: $STATE"
          fi

      - name: Publish to ClawHub
        if: steps.clawhub-check.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          # GITHUB_REF_NAME is always set by the runner (it's the branch, e.g.
          # "main", on a workflow_dispatch run) — a bash `:-` fallback never
          # sees it as empty, so `inputs.tag` was never actually used on a
          # manual retry. Branch on the event name instead.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_RAW="${{ inputs.tag }}"
          else
            TAG_RAW="$GITHUB_REF_NAME"
          fi
          VERSION="${TAG_RAW#v}"
          # NOTE: --family is intentionally NOT set. The first ClawHub publish
          # (v1.0.1) was auto-detected as `bundle-plugin` because this repo's
          # top-level `agents/` + `skills/` directories trigger ClawHub's bundle-
          # marker heuristic. ClawHub locks family at first publish — passing
          # `--family code-plugin` later is rejected with "family changes are not
          # allowed". Auto-detection on every release stays self-consistent.
          clawhub package publish "${{ github.repository }}@$TAG_RAW" \
            --version "$VERSION" \
            --tags latest \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-ref "$TAG_RAW" \
            --json

  github-release:
    name: create GitHub Release
    # Runs only after npm + ClawHub both succeed, so the release note is never
    # advertised for a version that failed to publish.
    needs: publish-clawhub
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create / edit the GitHub Release for the tag
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Create or update the GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TAG: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # On a tag push GITHUB_REF_NAME is the tag; for workflow_dispatch use the input.
          TAG="$REF_TAG"
          if [ -n "${DISPATCH_TAG:-}" ]; then TAG="$DISPATCH_TAG"; fi
          VERSION="${TAG#v}"

          # Pull this version's section out of CHANGELOG.md (Keep a Changelog
          # format: `## [X.Y.Z] ...` up to the next `## [` header).
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { flag = 1; next }
            /^## \[/ { if (flag) exit }
            flag
          ' CHANGELOG.md > release-notes.md || true

          # A hyphen in the tag (e.g. v1.2.3-rc.1) marks a prerelease.
          create_flags=(--verify-tag --title "$TAG")
          case "$TAG" in
            *-*) create_flags+=(--prerelease) ;;
            *)   create_flags+=(--latest) ;;
          esac

          if [ -s release-notes.md ]; then
            create_flags+=(--notes-file release-notes.md)
          else
            echo "::warning::No CHANGELOG section for $VERSION; generating notes from history."
            create_flags+=(--generate-notes)
          fi

          # Idempotent: update the note if the release already exists (e.g. a
          # manual pre-creation or a re-run), otherwise create it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating its notes."
            if [ -s release-notes.md ]; then
              gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
            else
              gh release edit "$TAG" --title "$TAG"
            fi
          else
            gh release create "$TAG" "${create_flags[@]}"
          fi
          echo "GitHub Release ready: $TAG"
